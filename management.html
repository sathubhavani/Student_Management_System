
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage Student Records Easily</p>
    </header>

    <div class="container">

        <div class="summary">
            <h2>Total Students: <span id="totalStudents">0</span></h2>
        </div>

        <section class="form-section">
            <h2>Add Student Details</h2>

            <form id="studentForm">
                <input type="text" id="name" placeholder="Student Name" required>
                <input type="text" id="roll" placeholder="Roll Number" required>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="text" id="course" placeholder="Course" required>
                <input type="number" id="year" placeholder="Year" min="1" max="6" required>

                <button type="submit" id="submitBtn">Add Student</button>
            </form>
        </section>

        <section class="records">
            <h2>Student Records</h2>

            <input type="text" id="search"
            placeholder="Search by name or roll number">

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Year</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentList"></tbody>
                </table>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
